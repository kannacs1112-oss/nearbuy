{% extends "base.html" %}{% block title %}Register shop{% endblock %}{% block content %}
<div class="page-heading"><div class="eyebrow">LOCAL BUSINESS PARTNER</div><h1>Register your <span>shop</span></h1><p>Share accurate business details. Your listing appears after admin approval.</p></div>
<form method="post" class="panel form-grid"><label>Shop name<input name="name" required value="{{ shop.name if shop else '' }}"></label><label>Category<select name="category">{% for c in categories %}<option {% if shop and shop.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>City<input name="city" required value="{{ shop.city if shop else 'Madurai' }}"></label><label>Area / neighbourhood<input name="area" value="{{ shop.area if shop else '' }}"></label><label>Contact phone<input name="phone" value="{{ shop.phone if shop else current_user.phone }}"></label><label>Address<input name="address" value="{{ shop.address if shop else '' }}"></label><label class="span-two">Description<textarea name="description" rows="3">{{ shop.description if shop else '' }}</textarea></label><div class="span-two"><button class="btn primary">Submit shop for approval</button></div></form>
{% endblock %}
